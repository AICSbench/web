name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated types are up to date
        run: |
          pnpm gen:types
          git diff --exit-code -- src/lib/types/export.ts || {
            echo "::error file=src/lib/types/export.ts::stale; run 'pnpm gen:types' and commit the result"
            exit 1
          }
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # Builds a fresh export from aicsbench/aicsbench's fixture submissions. Building
  # validates it against its own schemas, so a contract break in either repository fails here.
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AICSBENCH_REF: 6854e138ad6e262089dda9406345342c352a3ca3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aicsbench/aicsbench
          ref: ${{ env.AICSBENCH_REF }}
          path: aicsbench
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install aicsbench
        run: python -m pip install ./aicsbench
      - name: Export the fixture submissions
        working-directory: aicsbench
        run: >-
          aicsbench site export --data tests/fixtures/site-data
          --out "$RUNNER_TEMP/export" --base-url https://aicsbench.github.io/web/
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the fresh export
        run: EXPORT_DIR="$RUNNER_TEMP/export" pnpm build
